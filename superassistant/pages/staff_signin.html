{% extends "base.html" %}
{% block title %}{{ t.STAFF_SIGNIN_TITLE }}{% endblock %}
{% block content %}
<h1>{{ t.STAFF_SIGNIN_TITLE }}</h1>
{% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/staff/sign-in">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="login">{{ t.STAFF_LOGIN }}</label>
  <input type="text" id="login" name="login" value="{{ login }}" autocomplete="username" autocapitalize="none" required>
  <label for="password">{{ t.STAFF_PASSWORD }}</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button type="submit">{{ t.STAFF_SIGNIN_BUTTON }}</button>
</form>
<p class="hint"><a href="/staff/register">{{ t.STAFF_TO_REGISTER }}</a></p>
<p class="hint"><a href="/">{{ t.STAFF_TO_STUDENTS }}</a></p>
{% endblock %}
