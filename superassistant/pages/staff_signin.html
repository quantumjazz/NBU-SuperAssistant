{% extends "base.html" %}
{% block title %}{{ t.STAFF_SIGNIN_TITLE }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card"><div class="card-b">
    <h1>{{ t.STAFF_SIGNIN_TITLE }}</h1>
    {% if error %}<p class="flash error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span>{{ error }}</span></p>{% endif %}
    <form method="post" action="/staff/sign-in">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="f">
        <label for="login">{{ t.STAFF_LOGIN }}</label>
        <input type="text" id="login" name="login" value="{{ login }}" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="f">
        <label for="password">{{ t.STAFF_PASSWORD }}</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="actions"><button type="submit">{{ t.STAFF_SIGNIN_BUTTON }}</button></div>
    </form>
  </div></div>
  <p class="auth-foot"><a href="/staff/register">{{ t.STAFF_TO_REGISTER }}</a><br><a href="/">{{ t.STAFF_TO_STUDENTS }}</a></p>
</div>
{% endblock %}
