{% extends "base.html" %}
{% block title %}{{ t.SIGNIN_CHECK_TITLE }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card"><div class="card-b">
    <h1>{{ t.SIGNIN_CHECK_TITLE }}</h1>
    <p class="lead">{{ t.SIGNIN_CHECK_TEXT.format(email) }}</p>
    {% if error %}<p class="flash error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span>{{ error }}</span></p>{% endif %}
    <form method="post" action="/sign-in/code">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="f">
        <label for="code">{{ t.SIGNIN_CODE }}</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required>
      </div>
      <div class="actions"><button type="submit">{{ t.SIGNIN_CODE_BUTTON }}</button></div>
    </form>
  </div></div>
  <p class="auth-foot"><a href="/">{{ t.SIGNIN_OTHER_ADDRESS }}</a></p>
</div>
{% endblock %}
