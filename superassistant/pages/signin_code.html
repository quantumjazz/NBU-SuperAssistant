{% extends "base.html" %}
{% block title %}{{ t.SIGNIN_CHECK_TITLE }}{% endblock %}
{% block content %}
<h1>{{ t.SIGNIN_CHECK_TITLE }}</h1>
<p>{{ t.SIGNIN_CHECK_TEXT.format(email) }}</p>
{% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/sign-in/code">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="code">{{ t.SIGNIN_CODE }}</label>
  <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" required>
  <button type="submit">{{ t.SIGNIN_CODE_BUTTON }}</button>
</form>
<p class="hint"><a href="/">{{ t.SIGNIN_OTHER_ADDRESS }}</a></p>
{% endblock %}
