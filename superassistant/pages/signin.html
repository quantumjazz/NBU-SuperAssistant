{% extends "base.html" %}
{% block title %}{{ t.SIGNIN_TITLE }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card"><div class="card-b">
    <h1>{{ t.SIGNIN_TITLE }}</h1>
    <p class="lead">{{ t.SIGNIN_INTRO }}</p>
    {% if error %}<p class="flash error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span>{{ error }}</span></p>{% endif %}
    <form method="post" action="/sign-in">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="f">
        <label for="email">{{ t.SIGNIN_EMAIL }}</label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
      </div>
      <div class="actions"><button type="submit"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>{{ t.SIGNIN_SEND }}</button></div>
    </form>
    <ol class="how">{% for step in t.SIGNIN_HOW %}<li>{{ step }}</li>{% endfor %}</ol>
  </div></div>
  <p class="auth-foot"><a href="/staff/sign-in">{{ t.SIGNIN_STAFF_LINK }}</a></p>
</div>
{% endblock %}
