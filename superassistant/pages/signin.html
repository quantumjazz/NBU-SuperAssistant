{% extends "base.html" %}
{% block title %}{{ t.SIGNIN_TITLE }}{% endblock %}
{% block content %}
<h1>{{ t.SIGNIN_TITLE }}</h1>
<p>{{ t.SIGNIN_INTRO }}</p>
{% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/sign-in">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="email">{{ t.SIGNIN_EMAIL }}</label>
  <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required>
  <button type="submit">{{ t.SIGNIN_SEND }}</button>
</form>
<p class="hint"><a href="/staff/sign-in">{{ t.SIGNIN_STAFF_LINK }}</a></p>
{% endblock %}
