{% extends "base.html" %}
{% block title %}{{ t.SIGNIN_LINK_TITLE }}{% endblock %}
{% block content %}
<div class="auth">
  <div class="card"><div class="card-b">
    <h1>{{ t.SIGNIN_LINK_TITLE }}</h1>
    {% if error %}
    <p class="flash error" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-info"/></svg><span>{{ error }}</span></p>
    <p><a href="/">{{ t.SIGNIN_START_AGAIN }}</a></p>
    {% else %}
    <p class="lead">{{ t.SIGNIN_LINK_TEXT }}</p>
    <form method="post" action="/link/{{ token }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <div class="actions"><button type="submit">{{ t.SIGNIN_LINK_BUTTON }}</button></div>
    </form>
    {% endif %}
  </div></div>
</div>
{% endblock %}
